<!--Use CSS selectors (class, id, pseudo-classes) for styling.-->
<!DOCTYPE html>
<html lang="en">
    <head>
    <style>
        .heading {
            color: rgb(240, 93, 203);
            text-align: center;
        }
        #para {
            color: rgb(235, 163, 8);
            font-size: 20px;
        }
        .pseudoClass button:hover {
           background:#70b6fc; 
           transform:scale(1.05);
        }
    </style>
</head>
<body>
    <h1 class="heading">Class Selector</h1>
    <p id="para">ID selector.</p>
    <div class="pseudoClass">
        <button>Hover over me</button>
    </div>
</body>
</html>
