<!--Use CSS selectors (class, id, pseudo-classes) for styling.-->
<!DOCTYPE html>
<html lang="en">
    <head>
    <style>
        .heading {
            color: red;
          
        }
        #para {
            color: pink;
            font-size: 30px;
        }
        button:hover {
            background-color: orange;
            color: yellow;
           
            
        }
    </style>
</head>
<body>
    <h1 class="heading">Class</h1>
    <p id="para">This is  ID selector.</p>
    <button >CLICK HERE</button>
</body>
</html>
